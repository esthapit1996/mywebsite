version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # At most two npm PRs a week, so they never conflict over package.json and package-lock.json:
  # all patch bumps in one (merged automatically by ci.yml once the build passes) and all minor and
  # major bumps in another, for review
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      npm-minor-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"
